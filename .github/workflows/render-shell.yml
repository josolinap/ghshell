# =============================================================================
# RenderShell — GitHub Actions Workflow
# =============================================================================
# Spins up a RenderShell stack on a GitHub Actions runner:
#   - Tailscale exit node (userspace mode)
#   - Shellinabox web terminal (via Tailscale Serve on port 443 → 4200)
#   - SSH daemon (runner's built-in, with root password auth)
#   - HTTP status page (port 8080)
#
# AUTO-RETRIGGER: 2 minutes before the 6-hour limit, this workflow fires a
# new `workflow_dispatch` to start the next session — creating an infinite
# chain of 6-hour sessions with <2 min gap.
#
# Required secrets:
#   TAILSCALE_AUTHKEY — reusable auth key (tskey-auth-xxxxx-xxxxx)
#   ROOT_PASSWORD     — password for root SSH login
#
# Optional secrets:
#   TAILSCALE_HOSTNAME — custom hostname on your tailnet (default: render-shell)
# =============================================================================

name: RenderShell

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'How long to keep running (max 6)'
        type: number
        default: 6
        required: false
      hostname:
        description: 'Tailscale hostname override'
        type: string
        default: ''
        required: false

  schedule:
    - cron: '0 6,12,18 * * *'

  workflow_call:
    inputs:
      duration_hours:
        type: number
        default: 6
      hostname:
        type: string
        default: ''
    secrets:
      TAILSCALE_AUTHKEY:
        required: true
      ROOT_PASSWORD:
        required: true

concurrency:
  group: render-shell
  cancel-in-progress: false

jobs:
  render-shell:
    name: RenderShell Runner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup — install dependencies + configure services
        id: setup
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          TAILSCALE_HOSTNAME: ${{ inputs.hostname || secrets.TAILSCALE_HOSTNAME || 'render-shell' }}
        run: |
          bash setup-github-actions.sh
          echo "started_at=$(date -u +%s)" >> $GITHUB_OUTPUT

      - name: Tailscale Serve — expose web terminal
        run: |
          # Wait for tailscale to be fully connected
          echo "⏳ Waiting for tailscale to be ready..."
          for i in $(seq 1 30); do
            TS_STATUS=$(sudo tailscale status 2>/dev/null) && [ -n "$TS_STATUS" ] && break || true
            sleep 2
          done

          echo "✅ Tailscale is up"
          sudo tailscale status

          echo ""
          echo "🌐 Setting up Tailscale Serve..."
          # Expose shellinabox web terminal on root path (port 443 → 4200)
          sudo tailscale serve --bg 4200 2>&1 || true

          echo ""
          echo "🔗 Tailscale Serve config:"
          sudo tailscale serve status

      - name: Session Info
        env:
          HOSTNAME: ${{ inputs.hostname || secrets.TAILSCALE_HOSTNAME || 'render-shell' }}
        run: |
          TAILNET=""
          TS_STATUS=$(sudo tailscale status 2>/dev/null || true)
          if [ -n "$TS_STATUS" ]; then
            TAILNET=$(echo "$TS_STATUS" | head -1 | awk '{print $2}' | sed 's/.*@//')
          fi

          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║              🚀 RenderShell is LIVE                         ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "   Tailscale node:  ${HOSTNAME}"
          echo "   Tailnet:         ${TAILNET}"
          echo ""
          echo "   📡 Web Terminal:  https://${HOSTNAME}.${TAILNET}.ts.net/"
          echo "   📊 Status:        http://localhost:8080"
          echo ""
          echo "   Login:  root / <your ROOT_PASSWORD>"
          echo ""
          echo "   ⏱  Started: $(date -u)"
          echo "   ⏱  Expires: ~${{ inputs.duration_hours || 6 }} hours from now"
          echo "   ⏱  Job ID:  ${{ github.run_id }}"
          echo ""

      # ======================================================================
      # Keep-alive: the runner stays alive for the configured duration.
      # Every 5 min: heartbeat ping to prevent GH idle timeout.
      # 2 minutes before expiry: auto-trigger the NEXT run for infinite chaining.
      # ======================================================================
      - name: Keep Alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DURATION_HOURS=${{ inputs.duration_hours != '' && inputs.duration_hours || '6' }}
          DURATION_SECS=$(( DURATION_HOURS * 3600 ))
          END=$(( $(date -u +%s) + DURATION_SECS ))
          RETRIGGER_AT=$(( END - 120 ))

          RETRIGGER_FLAGS="--field duration_hours=${DURATION_HOURS}"
          HOSTNAME_OVERRIDE="${{ inputs.hostname }}"
          if [ -n "${HOSTNAME_OVERRIDE}" ]; then
            RETRIGGER_FLAGS="${RETRIGGER_FLAGS} --field hostname=${HOSTNAME_OVERRIDE}"
          fi

          echo "🧠 Keeping runner alive until $(date -d @${END} -u)"
          echo "   Duration: ${DURATION_HOURS} hours"
          echo "   Auto-retrigger at: $(date -d @${RETRIGGER_AT} -u)"

          while [ $(date -u +%s) -lt ${END} ]; do
            NOW=$(date -u +%s)

            # ── Retrigger window ──────────────────────────────────────────
            if [ ${NOW} -ge ${RETRIGGER_AT} ] && [ ${NOW} -lt $(( RETRIGGER_AT + 90 )) ]; then
              echo ""
              echo "🔄 Auto-retriggering next RenderShell session..."
              gh workflow run "${GITHUB_WORKFLOW}" \
                --ref "${GITHUB_REF_NAME}" \
                ${RETRIGGER_FLAGS} \
                2>&1 && echo "✅ Next session triggered!" || echo "⚠️  Retrigger failed"
            fi

            # Heartbeat — prevents GitHub from considering the runner idle
            curl -sf http://localhost:8080 >/dev/null 2>&1 || true
            sudo tailscale status >/dev/null 2>&1 || true
            sleep 300
            REMAINING=$(( (${END} - $(date -u +%s)) / 60 ))
            echo "❤️  ${REMAINING} minutes remaining..."
          done

          echo "⏰ Session complete."
