# =============================================================================
# RenderShell — GitHub Actions Workflow
# =============================================================================
# Spins up a RenderShell stack on a GitHub Actions runner:
#   - Tailscale exit node (userspace mode)
#   - WebShell (Python WebSocket terminal on port 4200 via Tailscale Serve)
#   - Tailscale Funnel (optional public internet exposure)
#   - SSH daemon (runner's built-in, with root password auth)
#   - HTTP status page (port 8080)
#
# AUTO-RETRIGGER: 2 minutes before the 6-hour limit, this workflow fires a
# new `workflow_dispatch` to start the next session — creating an infinite
# chain of 6-hour sessions with <2 min gap.
#
# Required secrets:
#   TAILSCALE_AUTHKEY — reusable auth key (tskey-auth-xxxxx-xxxxx)
#   ROOT_PASSWORD     — password for root SSH login
#
# Optional secrets:
#   TAILSCALE_HOSTNAME — custom hostname on your tailnet (default: render-shell)
#   FUNNEL — set to "true" to expose web terminal publicly via Funnel
#   WEBSHELL_TOKEN — token for web terminal auth (auto-generated if not set)
# =============================================================================

name: RenderShell

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'How long to keep running (max 6)'
        type: number
        default: 6
        required: false
      hostname:
        description: 'Tailscale hostname override'
        type: string
        default: ''
        required: false
      funnel:
        description: 'Expose web terminal publicly via Tailscale Funnel'
        type: boolean
        default: false
        required: false
      webshell_token:
        description: 'Token for web terminal auth (optional, auto-generated if not provided)'
        type: string
        default: ''
        required: false

  schedule:
    - cron: '0 6,12,18 * * *'

  workflow_call:
    inputs:
      duration_hours:
        type: number
        default: 6
      hostname:
        type: string
        default: ''
      funnel:
        type: boolean
        default: false
      webshell_token:
        type: string
        default: ''
    secrets:
      TAILSCALE_AUTHKEY:
        required: true
      ROOT_PASSWORD:
        required: true
      TAILSCALE_HOSTNAME:
        required: false
      FUNNEL:
        required: false
      WEBSHELL_TOKEN:
        required: false

concurrency:
  group: render-shell
  cancel-in-progress: false

jobs:
  render-shell:
    name: RenderShell Runner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup — install dependencies + configure services
        id: setup
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          TAILSCALE_HOSTNAME: ${{ inputs.hostname || secrets.TAILSCALE_HOSTNAME || 'render-shell' }}
          WEBSHELL_TOKEN: ${{ inputs.webshell_token != '' && inputs.webshell_token || secrets.WEBSHELL_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
        run: |
          bash setup-github-actions.sh
          echo "started_at=$(date -u +%s)" >> $GITHUB_OUTPUT

      - name: Tailscale Serve + Funnel — expose web terminal
        run: |
          # Wait for tailscale to be fully connected
          echo "⏳ Waiting for tailscale to be ready..."
          for i in $(seq 1 30); do
            TS_STATUS=$(sudo tailscale status 2>/dev/null) && [ -n "$TS_STATUS" ] && break || true
            sleep 2
          done

          echo "✅ Tailscale is up"
          sudo tailscale status

          echo ""
          echo "🌐 Setting up Tailscale Serve..."
          # Expose web terminal on root path (port 443 → 4200)
          sudo tailscale serve --bg 4200 2>&1 || true

          # Verify serve is working
          echo ""
          echo "🔗 Tailscale Serve status:"
          sudo tailscale serve status
          
          # Test that the serve endpoint is reachable
          echo ""
          echo "🔍 Verifying serve endpoint..."
          TAILNET=$(sudo tailscale status 2>/dev/null | head -1 | awk '{print $2}' | sed 's/.*@//')
          HOSTNAME="${{ inputs.hostname || secrets.TAILSCALE_HOSTNAME || 'render-shell' }}"
          SERVE_URL="https://${HOSTNAME}.${TAILNET}.ts.net"
          if curl -sf -o /dev/null --max-time 10 "$SERVE_URL" 2>/dev/null; then
            echo "✅ Serve endpoint reachable: $SERVE_URL"
          else
            echo "⚠️  Serve endpoint not yet reachable (may take a moment): $SERVE_URL"
            echo "   This is normal — Tailscale Serve propagation can take 10-30 seconds."
          fi

          # ── Funnel (public internet exposure) ────────────────────────
          FUNNEL="${{ inputs.funnel == true && 'true' || '' }}"
          if [ -z "$FUNNEL" ]; then
            FUNNEL="${FUNNEL:-${{ secrets.FUNNEL }}}"
          fi
          if [ "${FUNNEL}" = "true" ]; then
            echo ""
            echo "🌍 Attempting Tailscale Funnel (public internet)..."
            # Fire-and-forget — never block the workflow.
            # Funnel requires admin approval first.  If it fails, Serve still works.
            nohup sudo tailscale funnel --bg 4200 >/tmp/funnel.log 2>&1 &
            echo "   Funnel kicked off in background (see /tmp/funnel.log)."
            echo "   The Serve URL will still be available regardless."
          else
            echo ""
            echo "⏭️  Funnel not enabled."
            echo "   Pass 'funnel: true' at dispatch to expose the terminal publicly."
          fi

      - name: Session Info
        env:
          HOSTNAME: ${{ inputs.hostname || secrets.TAILSCALE_HOSTNAME || 'render-shell' }}
          WEBSHELL_TOKEN: ${{ inputs.webshell_token != '' && inputs.webshell_token || secrets.WEBSHELL_TOKEN }}
        run: |
          TAILNET=""
          TS_STATUS=$(sudo tailscale status 2>/dev/null || true)
          if [ -n "$TS_STATUS" ]; then
            TAILNET=$(echo "$TS_STATUS" | head -1 | awk '{print $2}' | sed 's/.*@//')
          fi

          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║              🚀 RenderShell is LIVE                         ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "   Tailscale node:  ${HOSTNAME}"
          echo "   Tailnet:         ${TAILNET}"
          echo ""
          echo "   📡 Web Terminal:  https://${HOSTNAME}.${TAILNET}.ts.net/"
          if [ -n "${WEBSHELL_TOKEN}" ]; then
            echo "   🔑 With token:     https://${HOSTNAME}.${TAILNET}.ts.net/?token=${WEBSHELL_TOKEN}"
            echo "   💡 Bookmark the above URL — token is stored in browser cookie"
          fi
          echo "   📊 Status page:   http://localhost:8080"
          echo ""
          echo "   ℹ️  If funnel was requested, it may take a minute to activate."
          echo "        The Serve URL above always works for approved tailnet peers."
          echo ""
          echo "   ⏱  Started: $(date -u)"
          echo "   ⏱  Expires: ~${{ inputs.duration_hours || 6 }} hours from now"
          echo "   ⏱  Job ID:  ${{ github.run_id }}"
          echo ""

      # ======================================================================
      # Keep-alive: the runner stays alive for the configured duration.
      # Every 5 min: heartbeat ping to prevent GH idle timeout.
      # 2 minutes before expiry: auto-trigger the NEXT run for infinite chaining.
      # ======================================================================
      - name: Keep Alive
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSHELL_TOKEN: ${{ inputs.webshell_token != '' && inputs.webshell_token || secrets.WEBSHELL_TOKEN }}
        run: |
          DURATION_HOURS=${{ inputs.duration_hours != '' && inputs.duration_hours || '6' }}
          DURATION_SECS=$(( DURATION_HOURS * 3600 ))
          END=$(( $(date -u +%s) + DURATION_SECS ))
          RETRIGGER_AT=$(( END - 120 ))

          RETRIGGER_FLAGS="--field duration_hours=${DURATION_HOURS}"
          HOSTNAME_OVERRIDE="${{ inputs.hostname }}"
          if [ -n "${HOSTNAME_OVERRIDE}" ]; then
            RETRIGGER_FLAGS="${RETRIGGER_FLAGS} --field hostname=${HOSTNAME_OVERRIDE}"
          fi
          # Preserve funnel flag
          FUNNEL_RETRIGGER="${{ inputs.funnel == true && 'true' || '' }}"
          if [ -z "$FUNNEL_RETRIGGER" ]; then
            FUNNEL_RETRIGGER="${FUNNEL:-${{ secrets.FUNNEL }}}"
          fi
          if [ "${FUNNEL_RETRIGGER}" = "true" ]; then
            RETRIGGER_FLAGS="${RETRIGGER_FLAGS} --field funnel=true"
          fi
          # Preserve webshell token
          if [ -n "${WEBSHELL_TOKEN}" ]; then
            RETRIGGER_FLAGS="${RETRIGGER_FLAGS} --field webshell_token=${WEBSHELL_TOKEN}"
          fi

          echo "🧠 Keeping runner alive until $(date -d @${END} -u)"
          echo "   Duration: ${DURATION_HOURS} hours"
          echo "   Auto-retrigger at: $(date -d @${RETRIGGER_AT} -u)"

          while [ $(date -u +%s) -lt ${END} ]; do
            NOW=$(date -u +%s)

            # ── Retrigger window ──────────────────────────────────────────
            if [ ${NOW} -ge ${RETRIGGER_AT} ] && [ ${NOW} -lt $(( RETRIGGER_AT + 90 )) ]; then
              echo ""
              echo "🔄 Auto-retriggering next RenderShell session..."
              gh workflow run "${GITHUB_WORKFLOW}" \
                --ref "${GITHUB_REF_NAME}" \
                ${RETRIGGER_FLAGS} \
                2>&1 && echo "✅ Next session triggered!" || echo "⚠️  Retrigger failed"
            fi

            # Health checks — verify services are still running
            HEALTH_OK=true
            curl -sf http://localhost:8080 >/dev/null 2>&1 || HEALTH_OK=false
            sudo tailscale status >/dev/null 2>&1 || HEALTH_OK=false
            curl -sf http://localhost:4200/health >/dev/null 2>&1 || HEALTH_OK=false
            
            # Verify Tailscale Serve is still configured
            sudo tailscale serve status >/dev/null 2>&1 || HEALTH_OK=false

            if [ "$HEALTH_OK" = false ]; then
              echo "⚠️  Health check failed — some services may be down"
            fi

            sleep 300
            REMAINING=$(( (${END} - $(date -u +%s)) / 60 ))
            echo "❤️  ${REMAINING} minutes remaining... (health: $([ "$HEALTH_OK" = true ] && echo "OK" || echo "DEGRADED"))"
          done

          echo "⏰ Session complete."
